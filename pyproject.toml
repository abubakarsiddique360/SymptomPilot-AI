[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "symptompilot"
version = "0.1.0"
description = "Local-first agentic symptom-triage assistant with hybrid retrieval, citations and a deterministic red-flag safety layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ABU BAKAR SIDDIQUE" }]
keywords = [
    "ai",
    "agentic",
    "rag",
    "triage",
    "health",
    "local-first",
    "privacy",
    "fastapi",
    "retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/abubakarsiddique360/SymptomPilot-AI"
Issues = "https://github.com/abubakarsiddique360/SymptomPilot-AI/issues"

[project.scripts]
symptompilot = "symptompilot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symptompilot = [
    "safety/*.yaml",
    "evaluation/*.yaml",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:symptompilot.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# RUF001/RUF002 flag typographic quotes and the "›" separator, both of which are
# intentional: curly quotes are normalised to ASCII at runtime, and "›" labels
# document sections in citations.
ignore = ["E501", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["symptompilot"]
