name: Feature request
description: Propose a new capability, knowledge-base page or retrieval improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behaviour you would like, including API shape if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Red-flag rules
        - Retrieval
        - Agent / composition
        - Web UI
        - API
        - Evaluation harness
        - Documentation
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Could this change alter urgency advice, citations or abstention behaviour?
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have read docs/safety.md and this request does not weaken the safety layer.
          required: true
